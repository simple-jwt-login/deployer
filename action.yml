name: 'Simple WordPress.org Plugin Deployer'
description: 'Deploy your WordPress plugin to WordPress.org'
author: 'nicumicle'
branding:
  icon: 'server'
  color: 'yellow'

inputs:
  plugin_folder:  
    description: 'GitHub repository folder where the plugin is located'
    required: true
    default: '/'  
  exclude:
    description: "Exclude specific files/folder to be added in the SVN repository. Separate by comma for multiple files/folders. .git, .github, .gitignore and .env are always excluded."
    required: false
  slug:
    description: 'Plugin Slug'
    required: true
  username:
    description: "SVN Username"
    required: false
  password:
    description: "SVN Password"
    required: false  
  tag: 
    description: "Tag to be used in the tags folder. It must not exist yet. A leading v is removed. When not provided, a tag is not created and only the trunk is folder updated."
    required: false
  assets_folder:
    description: "GitHub repository folder where the assets are located. If not provided, the assets folder is not updated."
    required: false
  dry_run:
    description: 'Run the deployment process without committing. Use true for a dry run; false or empty executes the svn commit.'
    required: false
  commit_message:
    description: "Set a custom commit message"
    required: false
runs:
  using: 'docker'
  image: 'Dockerfile'
