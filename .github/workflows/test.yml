name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y subversion rsync shellcheck
      - run: shellcheck entrypoint.sh test.sh tests/deploy_test.sh
      - run: ./tests/deploy_test.sh
